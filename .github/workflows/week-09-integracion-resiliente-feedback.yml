# Generated by engineering-professor. This workflow is formative feedback.
# Final grading repeats critical checks in an instructor-controlled runner.
name: Week 09 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Public Expo Android build
        run: npm run bundle:release
      - name: AC-01 — reproducibility
        run: make verify-week-09
      - name: Accumulated session, sync and resilience checks
        run: npm run test:security && npm run test:negative && npm run test:cloud && npm run test:session && npm run test:sync && npm run test:resilience
      - name: AC-02 — public behavior
        run: make public-test-week-09
      - name: AC-03 — declared failure evidence
        run: make evidence-week-09
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-week-09-integracion-resiliente
          if-no-files-found: warn
          path: |
            reports/week-09/**
            evidence/week-09/**
